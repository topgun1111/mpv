# Takipli Oynat tuşları (track.lua ile birlikte)
t script-binding track/toggle
r script-binding track/reset
x script-binding track/release
o script-binding track/offline
# Canlı ayarlar (Parça 13; canlı mod çalışırken). Ctrl+S mpv'nin pencere ekran görüntüsünü geçersiz kılar.
ctrl+up script-binding track/fill-up
ctrl+down script-binding track/fill-down
ctrl+right script-binding track/speed-up
ctrl+left script-binding track/speed-down
ctrl+pgup script-binding track/lead-up
ctrl+pgdwn script-binding track/lead-down
ctrl+0 script-binding track/settings-reset
ctrl+s script-binding track/settings-save
h script-binding track/status
ctrl+h script-binding track/hud
# Ekran üstü düğme paneli (fare/dokunmatik hareketinde görünür); Ctrl+B paneli sabitler/serbest bırakır
ctrl+b script-binding track/panel

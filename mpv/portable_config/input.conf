# Takipli Oynat tuşları (track.lua ile birlikte)
# SAĞ TIK: tıkla = nesne takibi; BASILI TUTUP SÜRÜKLE = dikdörtgen (kırmızı çerçeve görünür; takip edilen yerde beyaz nokta). Seçimden sonra ekrandaki +/- seçili alana yakınlaşır.
# takip kapalıysa kendiliğinden açılır (mpv'nin sağ tık = duraklat davranışı yerine; duraklatma: Boşluk).
# Hedefin üstüne tekrar sağ tık hedefi bırakır. Sol tık (takip açıkken) YOLO oyuncu kimliğiyle seçer.
MBTN_RIGHT script-binding track/pick
# SOL TUŞ: yalnız ekrandaki +/- düğmeleri için (imleç düğmenin üstündeyken); başka işlevi yok.
# Zoom: ekrandaki + / - düğmeleriyle aynı (mpv'nin ses gecikmesi + / - tuşları yerine)
+ script-binding track/zoom-in
- script-binding track/zoom-out
t script-binding track/toggle
r script-binding track/reset
x script-binding track/release
o script-binding track/offline
# Canlı ayarlar (Parça 13; canlı mod çalışırken). Ctrl+S mpv'nin pencere ekran görüntüsünü geçersiz kılar.
ctrl+up script-binding track/fill-up
ctrl+down script-binding track/fill-down
ctrl+right script-binding track/speed-up
ctrl+left script-binding track/speed-down
ctrl+pgup script-binding track/lead-up
ctrl+pgdwn script-binding track/lead-down
ctrl+0 script-binding track/settings-reset
ctrl+s script-binding track/settings-save
h script-binding track/status
ctrl+h script-binding track/hud
# ÇİFT SOL TIK: videoyu oynat/duraklat (mpv'nin varsayılan çift tık = tam ekran yerine; tam ekran: F)
MBTN_LEFT_DBL script-binding track/dblclick
# Ekran üstü düğme paneli (fare/dokunmatik hareketinde görünür); Ctrl+B paneli sabitler/serbest bırakır
ctrl+b script-binding track/panel
# Üst menü çubuğu (M1): fareyi pencere üstüne götür ya da F10; ok tuşları/Enter/Esc ile gez
F10 script-binding track/menu
# K: videoyu 90° döndür (0/90/180/270)
k script-binding track/rotate
# Dosya menüsü (M2): Ctrl+O = video aç (Windows dosya diyaloğu)
ctrl+o script-binding track/open
# Ctrl+D: tanı bilgisi (pencere/OSD boyutu, döndürme, zoom) ekranda 8 sn gösterilir
ctrl+d script-binding track/diag

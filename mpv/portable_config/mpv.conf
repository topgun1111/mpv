# Takipli Oynat - mpv ayarları
input-ipc-server=\\.\pipe\mpv
keep-open=yes
osd-level=1
# Zoom/pan sınır dışına taşarsa siyah kenar yerine kısıtlama Parça 5'te gözden geçirilecek
# --- VLC benzeri oynatma ayarları ---
cursor-autohide=1500
volume=100
volume-max=130
save-position-on-quit=yes
sub-auto=fuzzy
osd-font-size=32
# --- MPC klasik tema: dahili OSC kapalı, çubuğu scripts/mpcbar.lua çizer ---
osc=no
osd-bar=no

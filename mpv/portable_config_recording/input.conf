# Takipli Oynat Kayit tuslari (scripts/kayit.lua). Yalniz elle kamera: zoom + surukle -> kaydet.
# AKIS: KAYDET dugmesi (sag ust) veya R = hazir (oynatma BASLAMAZ; HIZ dugmesiyle hizi ayarla)
#       SPACE = 5 sn geri sayim sonra kaydi baslat (sayarken Space = vazgec) / kayitta duraklat / surdur;  KAYDET dugmesi veya R tekrar = kaydi durdur
#       S = kaydedilen kamera hareketini yuksek kaliteli yeni videoya aktar (<video>.kamera.mp4)
# Videoyu oynat/durdur: YALNIZ alttaki oynat dugmesi (Space, P, tik, cift tik oynatmaz).
# TEKERLEK = imlec etrafinda zoom; SOL TUS basili tut + surukle = kaydir (ikisi ayni anda olabilir).
# Sol tik ekrandaki dugmelerde = KAYDET / HIZ (ileri) / DONDUR (90 sola-saga, yalniz kayit baslamadan); HIZ dugmesinde sag tik = yavaslat.
MBTN_LEFT script-binding kayit/drag
MBTN_LEFT_DBL ignore
MBTN_RIGHT script-binding kayit/rclick
WHEEL_UP script-binding kayit/wheel-in
WHEEL_DOWN script-binding kayit/wheel-out
SPACE script-binding kayit/space
p ignore
PAUSE ignore
PLAYPAUSE ignore
# + / - zoom duzeyi (basili tut = surekli), 0 = gorunumu sifirla (mpv'nin ses tuslari yerine)
+ script-binding kayit/zoom-in
- script-binding kayit/zoom-out
0 script-binding kayit/reset
r script-binding kayit/record
# [ ] = onizleme hizi (0.25x-2x; kayit video saatinde, hizdan bagimsiz), K = videoyu 90 derece dondur (kayit baslamadan; ekrandaki dondur dugmeleriyle ayni)
[ script-binding kayit/slower
] script-binding kayit/faster
k script-binding kayit/rotate
# S = disa aktar; sirasinda Esc = iptal
s script-binding kayit/export

# Takipli Oynat Kayit tuslari (scripts/kayit.lua). Yalniz elle kamera: zoom + surukle -> R ile kaydet.
# SOL TUS basili tut + surukle = kaydir; TEKERLEK = imlec etrafinda zoom (surukleyerek de olur, ayni anda).
MBTN_LEFT script-binding kayit/drag
MBTN_LEFT_DBL cycle pause
WHEEL_UP script-binding kayit/wheel-in
WHEEL_DOWN script-binding kayit/wheel-out
# + / - zoom duzeyi (basili tut = surekli), 0 = gorunumu sifirla (mpv'nin ses tuslari yerine)
+ script-binding kayit/zoom-in
- script-binding kayit/zoom-out
0 script-binding kayit/reset
# R = kaydi baslat/durdur (baslarken basa sarar; durunca <video>.rec.json yazilir)
r script-binding kayit/record
# [ ] = onizleme hizi (0.25x-2x; kayit video saatinde, hizdan bagimsiz), K = videoyu 90 derece dondur
[ script-binding kayit/slower
] script-binding kayit/faster
k script-binding kayit/rotate
# Space = oynat/duraklat (mpv varsayilani)
# E = kayittaki kamera hareketini yeni videoya aktar (<video>.kamera.mp4); sirasinda Esc = iptal
e script-binding kayit/export

# Takipli Oynat Kayit - mpv ayarlari (yalniz elle kamera; takip/model yok)
input-ipc-server=\\.\pipe\mpv-kayit
keep-open=yes
# sol tusla surukleme videoyu kaydirir; pencereyi TASIMAZ
window-dragging=no
# The application owns its window dimensions, not the source video.
auto-window-resize=no
keepaspect-window=no
keepaspect=yes
geometry=70%x70%
hidpi-window-scale=no
force-window=yes
idle=yes
# video acilinca oynatma kendiliginden baslamaz (oynat dugmesiyle baslar)
pause=yes
osd-level=1
cursor-autohide=1500
volume=100
volume-max=130
save-position-on-quit=yes
osd-font-size=32
# Zoom/pan sinirlari scripts/kayit.lua icinde (clamp_view: video ekran kenarini siyah gostermez)

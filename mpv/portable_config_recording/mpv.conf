# Takipli Oynat Kayit - mpv ayarlari (yalniz elle kamera; takip/model yok)
input-ipc-server=\\.\pipe\mpv-kayit
keep-open=yes
# sol tusla surukleme videoyu kaydirir; pencereyi TASIMAZ
window-dragging=no
# The application owns its window dimensions, not the source video.
auto-window-resize=no
keepaspect-window=no
keepaspect=yes
geometry=70%x70%
hidpi-window-scale=no
force-window=yes
idle=yes
# Direct GPU decoding and rendering; the live grading shader keeps frames on the GPU.
vo=gpu
gpu-api=d3d11
gpu-context=d3d11
hwdec=auto
# Smooth frame presentation with a modest bounded read-ahead; no motion interpolation.
video-sync=display-resample
interpolation=no
framedrop=vo
cache=yes
demuxer-max-bytes=128MiB
demuxer-max-back-bytes=32MiB
demuxer-readahead-secs=8
# Low-cost preview scaling (does not change camera or editing export quality).
scale=bilinear
cscale=bilinear
dscale=bilinear
# video acilinca oynatma kendiliginden baslamaz (oynat dugmesiyle baslar)
pause=yes
osd-level=1
cursor-autohide=1500
volume=100
volume-max=130
save-position-on-quit=yes
osd-font-size=32
# Zoom/pan sinirlari scripts/kayit.lua icinde (clamp_view: video ekran kenarini siyah gostermez)

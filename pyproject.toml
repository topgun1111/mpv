[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tracker/update.py" = ["E501"]
"tests/test_update.py" = ["E501"]
"scripts/gen_golden.py" = ["E501"]
"tests/test_parts.py" = ["E501"]
"tests/test_scan_fixture.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

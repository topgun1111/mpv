name: Build All

# One run, one page, one version: every build of the project starts here and shows up together.
#   version       VERSION consistency + tag/build number for this run       scripts/version.py
#   tests         Python tests (ruff + pytest, Linux + Windows)            ci.yml
#   pc-full       Windows installer + portable zip                          build.yml
#   pc-recording  Windows recording variant                                 build-recording.yml
#   android       full app, flavors pose + sam (matrix)                     android.yml
#   android-rec   record-only app                                           android-rec.yml
#   release       ONE GitHub Release with all permitted assets (draft uploads, then publish)
# The five build files are reusable workflows (workflow_call) and have no triggers of their own, so nothing runs twice.
#
# Versioning (all apps share it; the number lives in VERSION and nowhere else you edit by hand):
#   push to main  -> prerelease  vX.Y.Z-b<run number>   (installed apps see it as an update)
#   tag vX.Y.Z    -> full Release vX.Y.Z                (the tag must equal VERSION; `python scripts/bump_version.py patch`, commit, tag)
#   every file in the release is named <App>-<X.Y.Z>-b<run number>.<ext>; SHA256SUMS.txt is attached.
# Pull requests run the tests and the phone apps (no Windows packaging, no release). To run one build alone:
# Actions -> pick that workflow -> Run workflow (standalone builds verify only). Build All on main publishes a prerelease.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # release job (tags + release assets); pull requests from forks stay read-only

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # Fails in seconds (not after an hour of builds) when a pinned version disagrees with VERSION or a v* tag does not match it.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      full: ${{ steps.v.outputs.full }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, tracker, recorder and Gradle agree
        run: python3 scripts/version.py check
      - name: Release tag for this run
        id: v
        run: python3 scripts/version.py release-info --ref "$GITHUB_REF" --build "$GITHUB_RUN_NUMBER" --github-output
      - name: Summary
        run: |
          echo "### Version \`${{ steps.v.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: \`${{ steps.v.outputs.tag }}\` (prerelease: ${{ steps.v.outputs.prerelease }})" >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: [version, tests]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create draft release (not visible to updaters)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          title="Draft $TAG (run $GITHUB_RUN_ID)"
          if gh release view "$TAG" --json isDraft,name > existing.json 2>/dev/null; then
            jq -e --arg title "$title" '.isDraft and .name == $title' existing.json >/dev/null || { echo "::error::Existing release belongs to another run or is already published"; exit 1; }
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --title "$title" --generate-notes
          else
            gh release create "$TAG" --verify-tag --draft --title "$title" --generate-notes
          fi

  pc-full:
    needs: [version, prepare]
    if: ${{ !cancelled() && needs.version.result == 'success' && github.event_name != 'pull_request' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.prepare.result == 'success' && needs.version.outputs.tag || '' }}

  pc-recording:
    needs: [version, prepare]
    if: ${{ !cancelled() && needs.version.result == 'success' && github.event_name != 'pull_request' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/build-recording.yml
    with:
      release_tag: ${{ needs.prepare.result == 'success' && needs.version.outputs.tag || '' }}

  android:
    needs: [version, prepare]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.prepare.result == 'success' && needs.version.outputs.tag || '' }}

  android-rec:
    needs: [version, prepare]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/android-rec.yml
    with:
      release_tag: ${{ needs.prepare.result == 'success' && needs.version.outputs.tag || '' }}

  # Uploads happen directly from each build runner to the same draft.
  # Only verified assets are published; keep the original licence policy.
  release:
    needs: [version, tests, prepare, pc-full, pc-recording, android, android-rec]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.tests.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download staged release assets for checksums (not Actions artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p release-files
          gh release download "$TAG" --pattern '*.exe' --pattern '*.zip' --pattern '*.apk' --dir release-files
      - name: Generate partial updates from recent signed Android recording releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/apk_delta.py --from-releases release-files/TakipliKayit-Android-*.apk
      - name: Validate release files and generate SHA256SUMS.txt
        env:
          PRIVATE: ${{ github.event.repository.private }}
          IS_TAG: ${{ needs.version.outputs.prerelease == 'false' }}
          FULL: ${{ needs.version.outputs.full }}
        run: |
          python3 scripts/release_assets.py release-files --private "$PRIVATE" --tag-release "$IS_TAG" --list assets.txt --notes notes.md
          python3 scripts/stage_release.py verify release-files --private "$PRIVATE" --tag-release "$IS_TAG" --full "$FULL" --complete
          if [ "$PRIVATE" = "false" ]; then
            printf '\nPublic Windows Tracking includes YOLOX, EdgeTAM and SAM 2.1. Optional pose, Re-ID and whole-body weights are not bundled; existing local weights are retained. AI Android APKs remain excluded by the model licence policy.\n' >> notes.md
          fi
      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release-files/*.patch release-files/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "$TAG" --notes-file notes.md --draft=false --prerelease="$PRERELEASE"
          echo "### Release [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # Keep the newest eight published prereleases. Never delete drafts or stable releases.
          gh release list --limit 100 --json tagName,isDraft,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.isDraft | not)) | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done

  # Remove a failed draft rather than exposing incomplete downloads.
  discard-draft:
    needs: [version, prepare, release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.release.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft,name | jq -e --arg title "Draft $TAG (run $GITHUB_RUN_ID)" '.isDraft and .name == $title' >/dev/null; then
            gh release delete "$TAG" --yes
          fi

  # One combined error log for the whole run: only the failed jobs, only the error lines with a little context.
  # The run summary and native job logs replace downloadable diagnostic artifacts.
  error-log:
    if: ${{ !cancelled() }}
    needs: [version, tests, pc-full, pc-recording, android, android-rec, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect the errors of every failed job into one file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=error-log.txt
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_REF_NAME, $GITHUB_SHA)" > "$out"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out") | [.id,.name] | @tsv' > failed.tsv || true
          if [ ! -s failed.tsv ]; then echo "No failed jobs." >> "$out"; fi
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            { echo; echo "=================== $name (job $id)"; } >> "$out"
            # always available, even if the full log cannot be downloaded: which step failed + the error annotations
            step=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" --jq '[.steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>&1) || true
            echo "Failed step: $step" >> "$out"
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | select(.annotation_level=="failure") | "  " + (.message | split("\n")[0])' 2>&1 | head -n 20 >> "$out" || true
            code=$(curl -sS -L -o job.log -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>curl.err) || true
            if [ "$code" = "200" ]; then
              sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g' job.log | grep -v -E '^\s+(at |\.\.\. [0-9]+ more)' > clean.log
              grep -n -E -B2 -A8 '##\[error\]|^e: |FAILED|What went wrong|Traceback|AssertionError|Error:|error:' clean.log | head -n 300 >> "$out" || true
            else
              echo "(full log not downloadable: HTTP $code $(head -c 200 curl.err) $(head -c 300 job.log | tr '\n' ' '))" >> "$out"
            fi
          done < failed.tsv
          { echo '```'; head -c 900000 "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

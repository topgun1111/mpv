name: Build All

# One run, one page, one version: every build of the project starts here and shows up together.
#   version       VERSION consistency + tag/build number for this run       scripts/version.py
#   tests         Python tests (ruff + pytest, Linux + Windows)            ci.yml
#   pc-full       Windows installer + portable zip                          build.yml
#   pc-recording  Windows recording variant                                 build-recording.yml
#   android       full app, flavors pose + sam (matrix)                     android.yml
#   android-rec   record-only app                                           android-rec.yml
#   release       ONE GitHub Release with every app of this run              (below)
# The five build files are reusable workflows (workflow_call) and have no triggers of their own, so nothing runs twice.
#
# Versioning (all apps share it; the number lives in VERSION and nowhere else you edit by hand):
#   push to main  -> prerelease  vX.Y.Z-b<run number>   (installed apps see it as an update)
#   tag vX.Y.Z    -> full Release vX.Y.Z                (the tag must equal VERSION; `python scripts/bump_version.py patch`, commit, tag)
#   every file in the release is named <App>-<X.Y.Z>-b<run number>.<ext>; SHA256SUMS.txt is attached.
# Pull requests run the tests and the phone apps (no Windows packaging, no release). To run one build alone:
# Actions -> pick that workflow -> Run workflow (workflow_dispatch still works; it never publishes a release).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # release job (tags + release assets); pull requests from forks stay read-only

jobs:
  # Fails in seconds (not after an hour of builds) when a pinned version disagrees with VERSION or a v* tag does not match it.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      full: ${{ steps.v.outputs.full }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, tracker, recorder and Gradle agree
        run: python3 scripts/version.py check
      - name: Release tag for this run
        id: v
        run: python3 scripts/version.py release-info --ref "$GITHUB_REF" --build "$GITHUB_RUN_NUMBER" --github-output
      - name: Summary
        run: |
          echo "### Version \`${{ steps.v.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: \`${{ steps.v.outputs.tag }}\` (prerelease: ${{ steps.v.outputs.prerelease }})" >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  pc-full:
    needs: version
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build.yml

  pc-recording:
    needs: version
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-recording.yml

  android:
    needs: version
    uses: ./.github/workflows/android.yml

  android-rec:
    needs: version
    uses: ./.github/workflows/android-rec.yml

  # One release for the whole run, after all builds. main: every build that succeeded goes on the prerelease (a flaky flavor does not
  # block the others; tests must pass). v* tag: every build must succeed. Licence rule for the AGPL pose models: scripts/release_assets.py.
  release:
    needs: [version, tests, pc-full, pc-recording, android, android-rec]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.tests.result == 'success' && (needs.version.outputs.prerelease == 'true' || !contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Only the finished, named files: installers, portable zips and the signed release APKs (no debug builds exist any more).
      - uses: actions/download-artifact@v4
        continue-on-error: true  # a skipped or failed build has no artifact
        with:
          pattern: "*-Setup"
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-Portable"
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-Release"
          path: release-files
          merge-multiple: true
      - name: Choose the files (licence rules) + SHA256SUMS.txt
        env:
          PRIVATE: ${{ github.event.repository.private }}
          IS_TAG: ${{ needs.version.outputs.prerelease == 'false' }}
        run: python3 scripts/release_assets.py release-files --private "$PRIVATE" --tag-release "$IS_TAG" --list assets.txt --notes notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          FULL: ${{ needs.version.outputs.full }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          mapfile -t files < assets.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file notes.md --generate-notes
            else
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
            fi
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "### Release [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          # keep the newest 8 prereleases (their tags go too); full releases are never deleted
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes || true; done

  # One combined error log for the whole run: only the failed jobs, only the error lines with a little context.
  # Download the artifact "error-log" (or open the run summary) instead of the per-job logs zip.
  error-log:
    if: ${{ !cancelled() }}
    needs: [version, tests, pc-full, pc-recording, android, android-rec, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect the errors of every failed job into one file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=error-log.txt
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_REF_NAME, $GITHUB_SHA)" > "$out"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out") | [.id,.name] | @tsv' > failed.tsv || true
          if [ ! -s failed.tsv ]; then echo "No failed jobs." >> "$out"; fi
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            { echo; echo "=================== $name (job $id)"; } >> "$out"
            # always available, even if the full log cannot be downloaded: which step failed + the error annotations
            step=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" --jq '[.steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>&1) || true
            echo "Failed step: $step" >> "$out"
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | select(.annotation_level=="failure") | "  " + (.message | split("\n")[0])' 2>&1 | head -n 20 >> "$out" || true
            code=$(curl -sS -L -o job.log -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>curl.err) || true
            if [ "$code" = "200" ]; then
              sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g' job.log | grep -v -E '^\s+(at |\.\.\. [0-9]+ more)' > clean.log
              grep -n -E -B2 -A8 '##\[error\]|^e: |FAILED|What went wrong|Traceback|AssertionError|Error:|error:' clean.log | head -n 300 >> "$out" || true
            else
              echo "(full log not downloadable: HTTP $code $(head -c 200 curl.err) $(head -c 300 job.log | tr '\n' ' '))" >> "$out"
            fi
          done < failed.tsv
          { echo '```'; head -c 900000 "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: error-log.txt
          if-no-files-found: ignore

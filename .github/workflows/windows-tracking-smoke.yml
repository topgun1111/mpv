name: Windows 11 tracker smoke test
on:
  workflow_dispatch:
  push:
    branches: [fix/windows-tracking-startup]
permissions:
  contents: read
jobs:
  player:
    runs-on: windows-11-arm
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Package x64 player and embedded runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/make_package.py --out "dist/Track Player"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_embedded.py --out "dist/Track Player"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/fetch_deps.ps1 -Target "dist/Track Player/mpv"
          Invoke-WebRequest "https://huggingface.co/Xenova/yolov8s-pose/resolve/9dd2818a340ad6682eb38c9d99b6c67dc054da4b/onnx/model.onnx" -OutFile "dist/Track Player/models/yolov8s-pose.onnx"
          Invoke-WebRequest "https://raw.githubusercontent.com/ultralytics/ultralytics/v8.3.0/ultralytics/assets/bus.jpg" -OutFile "dist/Track Player/bus.jpg"
          cargo build --release --manifest-path supervisor/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item supervisor/target/release/tracker.exe "dist/Track Player"
      - name: Run installed launcher and verify camera movement through mpv IPC
        shell: pwsh
        timeout-minutes: 4
        run: |
          Get-CimInstance Win32_OperatingSystem | Select Caption,Version,OSArchitecture
          & "dist/Track Player/python/python.exe" scripts/windows_live_smoke.py "dist/Track Player"
      - name: Start directly through mpv.exe with a fresh tracker
        shell: pwsh
        timeout-minutes: 4
        run: |
          $exe = (Resolve-Path "dist/Track Player/tracker.exe").Path
          Get-Process tracker -ErrorAction SilentlyContinue | Where-Object Path -eq $exe | Stop-Process -Force
          Remove-Item "$env:APPDATA/TakipliOynat/tracker.lock","E:/Tracking/tracker.lock" -Force -ErrorAction SilentlyContinue
          & "dist/Track Player/python/python.exe" scripts/windows_live_smoke.py "dist/Track Player" --direct
      - name: Package files for existing Windows installations
        shell: pwsh
        run: |
          $patch = "windows-tracking-update"
          New-Item -ItemType Directory -Force "$patch/mpv/portable_config/scripts","$patch/tracker" | Out-Null
          Copy-Item "dist/Track Player/Baslat.bat","dist/Track Player/StartTracker.bat","dist/Track Player/Takip.bat" $patch
          Copy-Item "dist/Track Player/mpv/portable_config/scripts/track.lua" "$patch/mpv/portable_config/scripts/"
          Copy-Item tracker/frames.py,tracker/live.py,tracker/ipc.py "$patch/tracker/"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tracking-update
          path: windows-tracking-update/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-recording-update
          path: mpv/portable_config_recording/scripts/kayit.lua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-screenshot
          path: dist/Track Player/tracked.png
          if-no-files-found: ignore
      - name: Player diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process | Where-Object Name -in "mpv.exe","tracker.exe","python.exe" | Select Name,CommandLine
          Get-Content "$env:TEMP/takipli-start.log","dist/Track Player/player.log" -Tail 100 -ErrorAction SilentlyContinue

name: SAM model export (EdgeTAM + SAM 2.1 Small)

# Exports both model families independently. Each matrix job has an isolated Python environment because
# EdgeTAM and SAM 2.1 both install a package named `sam2` and must never coexist in one environment.
on:
  workflow_call:
    inputs:
      variants:
        description: "Which model exports to run"
        type: string
        required: false
        default: both
  workflow_dispatch:
    inputs:
      variants:
        description: "Which model exports to run"
        type: choice
        default: both
        options: [both, edgetam, small]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          case "${{ inputs.variants || 'both' }}" in
            edgetam) echo 'matrix=["edgetam"]' >> "$GITHUB_OUTPUT" ;;
            small) echo 'matrix=["small"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'matrix=["edgetam","small"]' >> "$GITHUB_OUTPUT" ;;
          esac

  export:
    name: export-${{ matrix.variant }}
    needs: choose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.choose.outputs.matrix) }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.17.0 onnxruntime==1.20.1 timm==1.0.11 "huggingface_hub>=0.26,<1.0"
      - name: Install isolated model implementation
        run: |
          if [ "$VARIANT" = edgetam ]; then
            git clone --depth 1 https://github.com/facebookresearch/EdgeTAM.git "$RUNNER_TEMP/EdgeTAM"
            python -m pip install -e "$RUNNER_TEMP/EdgeTAM"
            python -c "import huggingface_hub, timm.models._hub as h; assert h._has_hf_hub, 'timm cannot import huggingface_hub'; print('huggingface_hub', huggingface_hub.__version__)"
          else
            python -m pip install git+https://github.com/facebookresearch/sam2.git
          fi
      - name: Export and validate all five ONNX graphs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "sam-models/$VARIANT"
          export_dir="sam-models/$VARIANT"
          case "$VARIANT" in
            edgetam) display_name="EdgeTAM" ;;
            small) display_name="SAM 2.1 Small" ;;
            *) display_name="$VARIANT" ;;
          esac
          echo "=== $display_name ==="
          on_error() {
            status=$?
            echo
            echo "ERROR: $display_name export failed (exit $status)."
            echo "Missing or empty required models:"
            for model in sam-encoder sam-decoder sam-decoder-trk sam-memenc sam-memattn; do
              file="$export_dir/$model.onnx"
              if [ ! -s "$file" ]; then echo "  ✗ $file"; else echo "  ✓ $file"; fi
            done
            echo
            echo "MODEL EXPORT: FAILED"
            exit "$status"
          }
          trap on_error ERR
          python scripts/export_sam2.py "$export_dir" "$VARIANT" 2>&1 | tee "export-$VARIANT.log"
          echo
          echo "=== FINAL MODEL CHECK: $display_name ==="
          for model in sam-encoder sam-decoder sam-decoder-trk sam-memenc sam-memattn; do
            file="$export_dir/$model.onnx"
            if [ ! -s "$file" ]; then
              echo "✗ $file (missing or empty)"
              echo "ERROR: required model verification failed: $file"
              false
            fi
            size=$(stat -c '%s' "$file")
            echo "✓ $file ($(numfmt --to=iec --suffix=B "$size"))"
          done
          echo "✓ ALL REQUIRED MODELS PRESENT"
          trap - ERR
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('sam-models') / __import__('os').environ['VARIANT']
          with (root / 'SHA256SUMS.txt').open('w') as f:
              for p in sorted(root.glob('*.onnx')):
                  f.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n")
          PY
          ls -lh "sam-models/$VARIANT"
          echo
          echo "MODEL EXPORT: SUCCESS"
      - name: Cache verified graphs for this exact build
        uses: actions/cache/save@v4
        with:
          key: sam-models-${{ github.run_id }}-${{ github.sha }}-${{ matrix.variant }}
          path: sam-models/${{ matrix.variant }}
          enableCrossOsArchive: true
      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "## SAM export failed: $VARIANT"
            echo "Variant: $VARIANT"
            python --version
            python -m pip freeze
            find sam-models -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
            tail -n 250 "export-$VARIANT.log" 2>/dev/null || true
          } > "failure-$VARIANT.txt"
          cat "failure-$VARIANT.txt"
          { echo ' ```'; head -c 500000 "failure-$VARIANT.txt"; echo ' ```'; } >> "$GITHUB_STEP_SUMMARY"

name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # Windows konsolu cp1252: Türkçe çıktı (ı, ş...) UnicodeEncodeError veriyordu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest -q
      - name: Paket klasörünü hazırla
        run: python scripts/make_package.py
      - name: Gömülü Python + bağımlılıklar
        run: python scripts/build_embedded.py
      - name: mpv indir
        shell: pwsh
        run: ./scripts/fetch_deps.ps1 -Target dist/TakipliOynat/mpv
      - name: Model indir (YOLOX-S, Apache-2.0; kurulumla birlikte gelir)
        shell: pwsh
        run: ./scripts/fetch_model.ps1 -Target dist/TakipliOynat/models
        # Özeti doğrulayınca env: YOLOX_S_SHA256 olarak sabitle (tedarik zinciri)
      - name: Pose modeli (YOLOv8s-pose, vücut parçası takibi; kişisel kullanım)
        shell: pwsh
        run: |
          pip install ultralytics onnx
          python scripts/export_pose.py dist/TakipliOynat/models yolov8s-pose
      - name: Paketlenmiş Python duman testi
        shell: pwsh
        working-directory: dist/TakipliOynat
        run: |
          .\python\python.exe -m tracker --version
          .\python\python.exe -c "import tracker, numpy, cv2, onnxruntime as o; p = o.get_available_providers(); print(p); assert 'DmlExecutionProvider' in p, 'DirectML yok'"
          .\python\python.exe -m tracker detect --help | Out-Null
          if (-not (Test-Path THIRD_PARTY_NOTICES.md)) { throw "THIRD_PARTY_NOTICES.md pakette yok" }
          if (-not (Test-Path mpv\BUILD_INFO.txt)) { throw "mpv/BUILD_INFO.txt yok (GPL kaynak teklifi)" }
          # Kurulumdan sonra elle bir şey gerekmesin: model pakette olmalı ve gerçekten çalışmalı
          if (-not (Test-Path models\yolox_s.onnx)) { throw "models\yolox_s.onnx pakette yok" }
          if (-not (Test-Path models\YOLOX_LICENSE.txt)) { throw "YOLOX lisans metni (Apache-2.0) pakette yok" }
          if (-not (Test-Path models\yolov8s-pose.onnx)) { throw "models\yolov8s-pose.onnx pakette yok" }
          .\python\python.exe -c "import numpy as np, cv2; cv2.imwrite('blank.jpg', np.zeros((720, 1280, 3), np.uint8))"
          .\python\python.exe -m tracker detect blank.jpg --model models\yolox_s.onnx --out blank_out.jpg
          if ($LASTEXITCODE -ne 0) { throw "YOLOX modeli duman testinde çalışmadı" }
          Remove-Item blank.jpg, blank_out.jpg -ErrorAction SilentlyContinue
      - name: Taşınabilir ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/TakipliOynat -DestinationPath dist/TakipliOynat-portable.zip
      - name: Installer derle (Inno Setup)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TakipliOynat
          path: |
            dist/TakipliOynat-portable.zip
            dist/installer/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TakipliOynat-portable.zip
            dist/installer/*.exe

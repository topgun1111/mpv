name: Windows native build and diagnostics
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg dependencies (classic mode; no baseline required)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install "qtbase[widgets]:x64-windows" "opencv4[dnn,ffmpeg,jpeg,png]:x64-windows" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTING=ON
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2
      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          cmake --version | Out-File diagnostics/environment.txt
          Get-ChildItem build -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.log','.txt','.json','.xml' } | ForEach-Object { $dst = Join-Path diagnostics ($_.Name + '-' + [guid]::NewGuid().ToString('N').Substring(0,6)); Copy-Item $_.FullName $dst -ErrorAction SilentlyContinue }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-executable-unbundled
          path: build/Release/TakipliOynatNative.exe

name: Android

# Signed release APKs are staged directly to the common draft when licence policy permits.
# Standalone and pull-request builds verify without publishing.

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: write  # upload only to a draft supplied by Build All

jobs:
  android:
    name: android-${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}  # app/build.gradle.kts: versionCode = (X*10000+Y*100+Z)*1000 + build, so builds update each other
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: pose
            gradle_task: Pose
          - flavor: sam
            gradle_task: Sam
    steps:
      # The `runner` context is not available in a job-level env, so MODEL_CKPT_DIR is exported for all later steps here.
      - name: Model checkpoint directory
        run: echo "MODEL_CKPT_DIR=$RUNNER_TEMP/model-checkpoints" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pose models into app assets (explicit list; AGPL-3.0, personal use)
        run: |
          # Keep the legacy TorchScript ONNX exporter: PyTorch 2.6+ defaults to
          # dynamo and requires a matching onnxscript opset23 implementation.
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.40 onnx==1.17.0 onnxruntime==1.20.1
          d=android/app/src/${{ matrix.flavor }}/assets/models
          # Keep the established pose exports on the original toolchain; the newer
          # YOLO26 head requires Ultralytics 8.4.x but retains [1,56,8400] output.
          if [ "${{ matrix.flavor }}" = "pose" ]; then models="yolov8s-pose yolo11m-pose"; else models="yolov8s-pose"; fi
          for m in $models; do python scripts/export_pose.py "$d" "$m"; done
          pip install ultralytics==8.4.216
          python scripts/export_pose.py "$d" yolo26m-pose
          ls -l "$d"
          for m in $models yolo26m-pose; do test -s "$d/$m.onnx" || { echo "missing $m.onnx"; exit 1; }; done
      - name: Qualcomm OSNet identity model (MIT, verified offline export)
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/osnet-onnx.zip" \
            'https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/osnet/releases/v0.66.0/osnet-onnx-float.zip'
          python scripts/prepare_osnet.py "$RUNNER_TEMP/osnet-onnx.zip" \
            "android/app/src/${{ matrix.flavor }}/assets/models/osnet-reid.onnx"
      - name: Export EdgeTAM and SAM 2.1 Small (five graphs each, isolated environments)
        if: matrix.flavor == 'sam'
        shell: bash
        run: |
          set -euo pipefail
          d=android/app/src/sam/assets/models
          mkdir -p "$d/edgetam" "$d/small"
          # EdgeTAM and SAM 2.1 both expose the Python package `sam2`; separate venvs prevent collisions.
          python -m venv "$RUNNER_TEMP/venv-edgetam"
          "$RUNNER_TEMP/venv-edgetam/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv-edgetam/bin/python" -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv-edgetam/bin/python" -m pip install onnx==1.17.0 onnxruntime==1.20.1 timm==1.0.11 "huggingface_hub>=0.26,<1.0"
          git clone --depth 1 https://github.com/facebookresearch/EdgeTAM.git "$RUNNER_TEMP/EdgeTAM"
          "$RUNNER_TEMP/venv-edgetam/bin/python" -m pip install -e "$RUNNER_TEMP/EdgeTAM"
          # timm reports "package not installed" when huggingface_hub is missing OR fails to import (e.g. a 1.x release): fail here with a clear message
          "$RUNNER_TEMP/venv-edgetam/bin/python" -c "import huggingface_hub, timm.models._hub as h; assert h._has_hf_hub, 'timm cannot import huggingface_hub'; print('huggingface_hub', huggingface_hub.__version__)"
          "$RUNNER_TEMP/venv-edgetam/bin/python" scripts/export_sam2.py "$d/edgetam" edgetam 2>&1 | tee "$RUNNER_TEMP/export-edgetam.log"

          python -m venv "$RUNNER_TEMP/venv-sam2"
          "$RUNNER_TEMP/venv-sam2/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv-sam2/bin/python" -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv-sam2/bin/python" -m pip install onnx==1.17.0 onnxruntime==1.20.1
          "$RUNNER_TEMP/venv-sam2/bin/python" -m pip install git+https://github.com/facebookresearch/sam2.git
          "$RUNNER_TEMP/venv-sam2/bin/python" scripts/export_sam2.py "$d/small" small 2>&1 | tee "$RUNNER_TEMP/export-small.log"

          for variant in edgetam small; do
            for model in sam-encoder sam-decoder sam-decoder-trk sam-memenc sam-memattn; do
              test -s "$d/$variant/$model.onnx" || { echo "missing $variant/$model.onnx"; exit 1; }
            done
          done
          ls -lhR "$d"
      - name: Validate exported Android models before packaging
        run: |
          python -m pip install onnx==1.17.0 onnxruntime==1.20.1
          python scripts/model_report.py "android/app/src/${{ matrix.flavor }}/assets/models" --preset "android-${{ matrix.flavor }}" --summary --json "model-logs/android-${{ matrix.flavor }}.json"
      - name: int8 EdgeTAM encoder for the NPU (only if android/calib has frames AND the accuracy gate passes; optional)
        if: matrix.flavor == 'sam'
        continue-on-error: true
        run: |
          n=$(ls android/calib/*.jpg android/calib/*.jpeg android/calib/*.png 2>/dev/null | wc -l)
          if [ "$n" -lt 10 ]; then echo "android/calib has $n frames (<10): keeping the fp16 encoder"; exit 0; fi
          pip install onnxruntime opencv-python-headless
          d=android/app/src/sam/assets/models
          set +e
          python scripts/quantize_edgetam.py "$d/edgetam/sam-encoder.onnx" "$RUNNER_TEMP/sam-encoder-int8.onnx" android/calib
          rc=$?
          if [ $rc -eq 0 ]; then mv "$RUNNER_TEMP/sam-encoder-int8.onnx" "$d/edgetam/sam-encoder.onnx"; echo "int8 EdgeTAM encoder in use"
          elif [ $rc -eq 3 ]; then echo "accuracy gate failed: fp16 encoder kept"
          else exit $rc; fi
      - name: int8 QDQ pose models for the NPU (only if android/calib has frames; optional)
        continue-on-error: true
        run: |
          n=$(ls android/calib/*.jpg android/calib/*.jpeg android/calib/*.png 2>/dev/null | wc -l)
          if [ "$n" -lt 10 ]; then echo "android/calib has $n frames (<10): skipping int8"; exit 0; fi
          pip install onnxruntime opencv-python-headless
          d=android/app/src/${{ matrix.flavor }}/assets/models
          python scripts/quantize_android.py "$d/yolov8s-pose.onnx" "$d/yolov8s-pose-int8.onnx" android/calib
          python scripts/quantize_android.py "$d/yolov8s-pose.onnx" "$d/yolov8s-pose-a16w8.onnx" android/calib --a16
          ls -l "$d"
      - name: Android SDK (accepts licences)
        uses: android-actions/setup-android@v3
        with:
          packages: ""  # default `tools platform-tools` fails: package `tools` no longer exists
      - name: Gradle (installs the pinned version and caches it)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests + signed release APK (same committed key every build, so it installs over the previous one)
        working-directory: android
        timeout-minutes: 30
        run: gradle --no-daemon --stacktrace :core:test :app:assemble${{ matrix.gradle_task }}Release
      - name: Models are inside the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk
          test -s "$apk" || { echo "release APK was not produced (unsigned?)"; ls -l "$(dirname "$apk")"; exit 1; }
          entries=$(unzip -Z1 "$apk")
          grep -Fxq 'assets/models/osnet-reid.onnx' <<< "$entries" || { echo 'APK missing OSNet ReID'; exit 1; }
          if [ "${{ matrix.flavor }}" = "pose" ]; then
            for model in yolov8s-pose.onnx yolo11m-pose.onnx yolo26m-pose.onnx; do
              grep -Fxq "assets/models/$model" <<< "$entries" || { echo "APK missing $model"; exit 1; }
            done
            echo "pose APK must include yolov8s-pose.onnx, need yolo11m-pose.onnx and yolo26m-pose.onnx"
          else
            grep -Fxq "assets/models/yolov8s-pose.onnx" <<< "$entries" || { echo "APK missing yolov8s-pose.onnx"; exit 1; }
            grep -Fxq "assets/models/yolo26m-pose.onnx" <<< "$entries" || { echo "APK missing yolo26m-pose.onnx"; exit 1; }
            for variant in edgetam small; do
              for model in sam-encoder sam-decoder sam-decoder-trk sam-memenc sam-memattn; do
                grep -Fxq "assets/models/$variant/$model.onnx" <<< "$entries" || { echo "APK missing $variant/$model.onnx"; exit 1; }
              done
            done
          fi
      - name: Name the APK
        run: |
          v=$(tr -d "[:space:]" < VERSION)
          mkdir -p dist-android/release
          cp android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk "dist-android/release/TakipliOynat-Android-${{ matrix.flavor }}-$v-b${{ github.run_number }}.apk"
      - name: Stage permitted release files directly
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRIVATE: ${{ github.event.repository.private }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python scripts/stage_release.py upload "dist-android/release/*.apk"
      - name: Model diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/export-*.log; do
            if [ -f "$f" ]; then echo "=== $f ==="; tail -n 100 "$f"; fi
          done

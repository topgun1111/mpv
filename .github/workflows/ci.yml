name: CI
on:
  workflow_call:  # started by build-all.yml (push / tag / pull request); this file no longer has its own triggers
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Lua (test_lua_* CI'da atlanmasın)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.3 mpv ffmpeg
          lua -v
          echo "REQUIRE_LUA=1" >> "$GITHUB_ENV"
          echo "REQUIRE_EDITING_MPV=1" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        timeout-minutes: 12

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Lua (test_lua_* CI'da atlanmasın)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.3
          lua -v
          echo "REQUIRE_LUA=1" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

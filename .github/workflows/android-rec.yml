name: Android Record

# Record-only Android app (android/rec, package com.takipli.oynat.rec): no pose models, no tracking, no ONNX Runtime / OpenCV.
# Separate workflow so android.yml (pose / sam) and its tests stay untouched. No models to export, so this one is fast.
# Signed record APK goes directly to the shared draft release.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: write  # upload only to a draft supplied by Build All

jobs:
  android-rec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_NUMBER: ${{ github.run_number }}  # android/rec/build.gradle.kts: versionCode = (X*10000+Y*100+Z)*1000 + build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (accepts licences)
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Gradle (installs the pinned version and caches it)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests + signed release APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :core:test :rec:assembleRelease
      - name: Record app has no AI / tracking payload
        run: |
          apk=android/rec/build/outputs/apk/release/rec-release.apk
          test -s "$apk" || { echo "release APK missing"; ls -l android/rec/build/outputs/apk/release; exit 1; }
          if unzip -l "$apk" | grep -Ei "\.onnx|libonnxruntime|libopencv|libQnn"; then echo "unexpected AI/tracking files in the record APK"; exit 1; fi
          ls -l "$apk"
      - name: Name the APK
        run: |
          v=$(tr -d "[:space:]" < VERSION)
          mkdir -p dist-rec/release
          cp android/rec/build/outputs/apk/release/rec-release.apk "dist-rec/release/TakipliKayit-Android-$v-b${{ github.run_number }}.apk"
      - name: Stage permitted release files directly
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRIVATE: ${{ github.event.repository.private }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python scripts/stage_release.py upload "dist-rec/release/*.apk"
